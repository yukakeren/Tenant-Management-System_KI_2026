{% extends "base.html" %}
{% block title %}Change password · KosanKu{% endblock %}
{% block content %}
<div class="card mx-auto max-w-sm">
  <h1 class="text-xl font-semibold">Change password</h1>
  {% if user.must_change_password %}
    <p class="mt-2 text-sm text-slate-600">You're using a temporary password. Pick your own before you continue.</p>
  {% endif %}
  {% if error %}<div class="flash-err mt-4">{{ error }}</div>{% endif %}
  <form method="post" action="/account/password" class="mt-4 space-y-4">
    <input type="hidden" name="csrf" value="{{ request.session.csrf }}">
    <div>
      <label class="label" for="old_password">Current password</label>
      <input class="input" id="old_password" name="old_password" type="password" required>
    </div>
    <div>
      <label class="label" for="new_password">New password (at least 10 characters)</label>
      <input class="input" id="new_password" name="new_password" type="password" minlength="10" required>
    </div>
    <div>
      <label class="label" for="confirm_password">New password again</label>
      <input class="input" id="confirm_password" name="confirm_password" type="password" minlength="10" required>
    </div>
    <button class="btn w-full justify-center">Save password</button>
  </form>
</div>
{% endblock %}
